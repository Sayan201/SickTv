name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lists-and-tools:
    name: Lists, tools and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tools virtualenv
        run: |
          python3 -m venv tools/venv
          tools/venv/bin/pip install -q -r tools/requirements.txt
      - name: Example lists, README tables, shell helpers
        env:
          SICKTV_STRICT: ${{ github.event_name == 'push' && '1' || '' }}
          CLEANYOURTV_STRICT: ${{ github.event_name == 'push' && '1' || '' }}
        run: python3 -m unittest discover -s tests -v

  launcher:
    name: Launcher builds and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - uses: gradle/actions/setup-gradle@v4
      - name: Launcher unit tests, lint and release builds
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease
      - name: SickTv companion release build
        working-directory: launcher/companion
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon :app:assembleGithubRelease --stacktrace 2>&1 | tee /tmp/build.log || {
            python3 -c "
with open('/tmp/build.log') as f:
    text = f.read()
idx = text.find('* What went wrong:')
if idx != -1:
    chunk = text[idx:idx+1500].replace('\n', ' ').replace('\r', '')
    print(f'::error title=What Went Wrong::{chunk}')
else:
    print('::error title=Tail::' + ' '.join(text.splitlines()[-20:]))
"
            exit 1
          }
      - name: Original launcher stays small
        run: |
          size=$(stat -c %s launcher/app/build/outputs/apk/release/app-release.apk)
          echo "original launcher APK: $((size / 1024)) KB"
          test "$size" -lt 5242880 || { echo "Original launcher APK is over 5 MiB; review launcher assets"; exit 1; }
      - name: Upload SickTv companion APK
        uses: actions/upload-artifact@v4
        with:
          name: SickTv-Phone-Companion-Signed-APK
          path: launcher/companion/app/build/outputs/apk/github/release/app-github-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload companion build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: companion-build-log
          path: /tmp/build.log
          if-no-files-found: ignore
          retention-days: 7
